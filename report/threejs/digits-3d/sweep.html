<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D trajectory sweep selector</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f172a;color:#f8fafc;font:14px system-ui}body{display:grid;grid-template-columns:330px 1fr}aside{padding:18px;border-right:1px solid #334155;overflow:auto}h1{font-size:20px}label{display:block;color:#94a3b8;margin:14px 0 5px}select{width:100%;padding:9px;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:8px}#runs{margin-top:15px;display:grid;gap:7px}button{padding:9px;text-align:left;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;cursor:pointer}button.active,button:hover{border-color:#38bdf8}iframe{width:100%;height:100%;border:0}.muted{color:#94a3b8;line-height:1.4}</style></head>
<body><aside><h1>Trajectory sweep</h1><p class="muted">Filter configurations, then select a run. The viewer and loss chart update together.</p><label>Embedding dimension</label><select id="dim"><option value="">All</option></select><label>Trained symbols</label><select id="trained"><option value="">All</option></select><label>Held-out letters</label><select id="held"><option value="">All</option></select><label>Dropped symbols</label><select id="dropped"><option value="">All</option></select><label>Dropout progress</label><select id="dropPercent"><option value="">All</option></select><label>WTE / LM head</label><select id="tying"><option value="">All</option><option value="true">Tied</option><option value="false">Untied</option></select><div id="runs"></div></aside><iframe id="viewer" title="Token trajectory viewer"></iframe>
<script>
const state={runs:[],selected:null};
const dimSelect=document.querySelector('#dim'),trainedSelect=document.querySelector('#trained'),heldSelect=document.querySelector('#held'),droppedSelect=document.querySelector('#dropped'),dropPercentSelect=document.querySelector('#dropPercent'),tyingSelect=document.querySelector('#tying'),runList=document.querySelector('#runs'),viewer=document.querySelector('#viewer');
const unique=key=>[...new Set(state.runs.map(run=>run[key]))].sort((a,b)=>a-b);
function selectRun(run){state.selected=run;viewer.src=`index.html?data=${encodeURIComponent(run.file)}`;render()}
function render(){
  const filtered=state.runs.filter(run=>(!dimSelect.value||run.embedding_dim==dimSelect.value)&&(!trainedSelect.value||run.trained_tokens==trainedSelect.value)&&(!heldSelect.value||run.held_out_tokens==heldSelect.value)&&(!droppedSelect.value||run.dropped_tokens==droppedSelect.value)&&(!dropPercentSelect.value||Math.round(100*run.dropout_iteration/run.final_iteration)==dropPercentSelect.value)&&(!tyingSelect.value||String(run.wte_weight_tying)===tyingSelect.value));
  runList.innerHTML='';
  if(!filtered.includes(state.selected))state.selected=null;
  filtered.forEach(run=>{const pct=Math.round(100*run.dropout_iteration/run.final_iteration);const button=document.createElement('button');button.textContent=`${run.embedding_dim}D · ${run.trained_tokens} trained · ${run.held_out_tokens} held · drop ${run.dropped_tokens} @ ${pct}% · ${run.wte_weight_tying?'tied':'untied'} · ${run.fixed_norm==null?'free':`radius ${Number(run.fixed_norm).toFixed(2)}`}`;button.className=run===state.selected?'active':'';button.onclick=()=>selectRun(run);runList.appendChild(button)});
  if(!state.selected&&filtered.length)selectRun(filtered[0]);
}
fetch('runs/manifest.json').then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(manifest=>{state.runs=manifest.runs;[[dimSelect,'embedding_dim'],[trainedSelect,'trained_tokens'],[heldSelect,'held_out_tokens'],[droppedSelect,'dropped_tokens']].forEach(([select,key])=>unique(key).forEach(value=>select.add(new Option(value,value))));[...new Set(state.runs.map(run=>Math.round(100*run.dropout_iteration/run.final_iteration)))].sort((a,b)=>a-b).forEach(value=>dropPercentSelect.add(new Option(`${value}%`,value)));[dimSelect,trainedSelect,heldSelect,droppedSelect,dropPercentSelect,tyingSelect].forEach(select=>select.onchange=render);render()}).catch(error=>runList.textContent=`Could not load sweep manifest: ${error.message}`);
</script></body></html>
