# Compare conventional causal attention against triadic_hyperrot.
# Run with:
#   python optimization_and_search/run_from_yaml.py --yaml triadic_hyperrot_compare.yaml --output_dir out_triadic_hyperrot_compare
---
configs:
  - dataset: minipile
    attention_variant: causal
    n_head: 3
    n_kv_group: 3
    softmax_variant_attn: softmax
    use_rotary_embeddings: true
    use_abs_pos_embeddings: false
    eval_interval: 2500
    max_iters: 10000
    never_save_checkpoint: true
    compile: true
    log_rankme: true
    log_areq: true

  - dataset: minipile
    attention_variant: triadic_hyperrot
    n_head: 3
    n_kv_group: 3
    trirot_n_triplets: 1
    trirot_output_mode: replace_a
    trirot_theta_max_deg: 30.0
    trirot_angle_gain_init: 0.0
    trirot_require_distinct_values: true
    softmax_variant_attn: softmax
    use_rotary_embeddings: true
    use_abs_pos_embeddings: false
    eval_interval: 2500
    max_iters: 10000
    never_save_checkpoint: true
    compile: true
    log_rankme: true
    log_areq: true

  # Optional follow-up after replace_a shows signal: literal one-output-per-triple bottleneck.
  - dataset: minipile
    attention_variant: triadic_hyperrot
    n_head: 3
    n_kv_group: 3
    trirot_n_triplets: 1
    trirot_output_mode: triad_only
    trirot_theta_max_deg: 30.0
    trirot_angle_gain_init: 0.0
    trirot_require_distinct_values: true
    softmax_variant_attn: softmax
    use_rotary_embeddings: true
    use_abs_pos_embeddings: false
    eval_interval: 2500
    max_iters: 10000
    never_save_checkpoint: true
    compile: true
    log_rankme: true
    log_areq: true
