<!doctype html><html><head><meta charset="utf-8"><title>LayerNorm Channel Explorer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>body{font:15px system-ui;max-width:1200px;margin:auto;padding:2rem;background:#101522;color:#edf2ff}input,select,button{padding:.55rem;margin:.2rem}button{background:#6c7cff;color:white;border:0}.plot{height:350px}</style></head>
<body><h1>LayerNorm per-channel gains</h1><p>Load an AutoModelForCausalLM, select a normalization and token embedding row. All three plots use the gain-descending channel order.</p>
<input id="model" value="google/gemma-3-270m" size="35"><input id="device" value="cpu"><label><input id="download" type="checkbox" checked>download if missing</label><button onclick="loadModel()">Load</button><span id="status"></span><br>
<select id="norm"></select><select id="embedding"><option>input</option><option>output</option></select><input id="token" type="number" min="0" value="0"><button onclick="draw()">Plot</button>
<div id="gain" class="plot"></div><div id="before" class="plot"></div><div id="after" class="plot"></div>
<script>
async function json(url, options){const r=await fetch(url,options);const x=await r.json();if(!r.ok)throw Error(x.detail||r.statusText);return x}
async function loadModel(){status.textContent=' loading…';try{const x=await json('/api/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_name:model.value,device:device.value,allow_download:download.checked})});norm.innerHTML=x.norms.map(n=>`<option>${n}</option>`).join('');status.textContent=` ${x.norms.length} norms, vocab ${x.vocab_size}`}catch(e){status.textContent=' '+e}}
async function draw(){try{const q=new URLSearchParams({norm:norm.value,token_id:token.value,embedding:embedding.value});const x=await json('/api/plot?'+q);const layout=(title)=>({title,xaxis:{title:'rank (gain high → low)'},yaxis:{title:'value'},paper_bgcolor:'#101522',plot_bgcolor:'#101522',font:{color:'#edf2ff'}});Plotly.newPlot('gain',[{type:'bar',x:x.channel,y:x.gain,name:'gain'}],layout(`${x.norm}: gain`));Plotly.newPlot('before',[{type:'bar',x:x.channel,y:x.before}],layout(`embedding ${x.token_id}: before`));Plotly.newPlot('after',[{type:'bar',x:x.channel,y:x.after}],layout(`embedding ${x.token_id}: after selected norm`))}catch(e){status.textContent=' '+e}}
</script></body></html>
