---

# Compare normalizing queries and keys before versus after applying RoPE.
common_group:
  dataset: ["minipile"]
  eval_interval: [500]
  max_iters: [10000]
  never_save_checkpoint: [true]
  compile: [true]
  use_qk_norm: [true]
  use_qk_norm_scale: [true]
  use_rotary_embeddings: [true]
  use_abs_pos_embeddings: [false]

qk_norm_before_rope: [true, false]
