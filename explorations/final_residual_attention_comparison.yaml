---

named_static_groups:
  - named_group: "baseline"
    attention_variant: ["causal"]
    use_final_residual_attention: [false]

  - named_group: "final_resid_attn"
    attention_variant: ["infinite"]
    use_concat_heads: [true]
    use_final_residual_attention: [true]
    final_residual_attention_norm_variant: ["rmsnorm"]

  - named_group: "rotary"
    use_rotary_embeddings: [true]
    use_abs_pos_embeddings: [false]

  - named_group: "peri_ln"
    use_pre_ln: [true]
    use_peri_ln: [true]
    use_post_ln: [false]

common_group:
  dataset: ["minipile"]
  eval_interval: [2500]
  max_iters: [10000]
  never_save_checkpoint: [true]
  compile: [true]
  log_rankme: [true]
  log_areq: [true]

parameter_groups:
  - named_group_static:
      - "rotary"
      - "peri_ln"
      - "baseline"
    n_layer: [6]
    n_head: [6]
    n_embd: [384]

  - named_group_static:
      - "rotary"
      - "peri_ln"
      - "final_resid_attn"
    n_layer: [6]
    n_head: [6]
    n_kv_group: [6]
    n_embd: [384]
    n_qk_head_dim: [64]
    n_v_head_dim: [64]
    final_residual_attention_n_head: [6]
    final_residual_attention_n_qk_head_dim: [64]
    final_residual_attention_n_v_head_dim: [64]
